name: CSB actions
on: [workflow_dispatch, push, pull_request]

jobs:
   Compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [syz-trace2syz, syz-prog2c, syz-extraction]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Compile ${{ matrix.tool }}
        run: |
          go env -w GOBIN=$HOME/.local/bin
          make
          cd tools/${{ matrix.tool }}
          go build

    Test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/setup-go@v5
          with:
            go-version: '1.25'
        - name: run bm-generator from CSB
          run : |
            git clone https://github.com/open-s4c/csb.git
            cd csb
            git submodule update --init
            cd deps/syzkaller/
            git fetch
            echo "checking out ${{ github.ref_name }}"
            git checkout ${{ github.ref_name }}
            cd ../../
            go env -w GOBIN=$HOME/.local/bin
            cd bm-generator
            ./test.sh


